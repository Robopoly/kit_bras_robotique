; PlatformIO Project Configuration File pour la manette Kit JIG - version Bras Robotique (sans écran)
;
; Build options: build flags, source filter
; Upload options: custom upload port, speed and extra flags
; Library options: dependencies, extra library storages

[env:esp32-s3-devkitm-1]
platform = espressif32
board = esp32-s3-devkitm-1
framework = arduino

; Aucune bibliothèque externe : ESP-NOW et WiFi font partie du framework

; Options de compilation
build_flags =
	-DCORE_DEBUG_LEVEL=0

; Moniteur série (doit correspondre à Serial.begin dans main.cpp)
monitor_speed = 115200
